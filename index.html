<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My iPhone Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background: #0b0f19; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #fff; }
        
        /* iPhone Container */
        .iphone { width: 375px; height: 780px; background: #000; border-radius: 52px; border: 12px solid #27272a; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; }
        
        /* Dynamic Island */
        .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 115px; height: 32px; background: #000; border-radius: 20px; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
        .camera { width: 12px; height: 12px; background: #18181b; border-radius: 50%; }
        
        /* Screen */
        .screen { flex: 1; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 55px 22px 30px; }
        
        /* Lockscreen */
        .lock-screen { position: absolute; inset: 0; background: rgba(10, 10, 15, 0.45); backdrop-filter: blur(16px); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 20px 40px; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .lock-screen.unlocked { transform: translateY(-100%); }
        .clock { font-size: 68px; font-weight: 700; text-shadow: 0 4px 20px rgba(0,0,0,0.4); letter-spacing: -2px; }
        .date { font-size: 16px; font-weight: 500; opacity: 0.9; margin-top: -10px; text-shadow: 0 2px 10px rgba(0,0,0,0.4); text-align: center; }

        /* Passcode View */
        .passcode-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; }
        .passcode-title { font-size: 14px; opacity: 0.8; font-weight: 500; }
        .passcode-dots { display: flex; gap: 12px; margin-bottom: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; transition: background 0.2s; }
        .dot.filled { background: #fff; }
        .dot.error { border-color: #ef4444; background: #ef4444; }

        /* Keypad */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; }
        .key-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 24px; font-weight: 500; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: background 0.15s; }
        .key-btn:active { background: rgba(255,255,255,0.4); }

        /* Homescreen Apps Grid */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 16px; margin-top: 15px; }
        .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .app-icon { width: 62px; height: 62px; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: transform 0.15s; }
        .app-icon:active { transform: scale(0.88); }
        .app-name { font-size: 11.5px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); letter-spacing: -0.2px; }
        
        /* App Colors */
        .bg-profile { background: linear-gradient(135deg, #38bdf8, #0284c7); }
        .bg-insta { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
        .bg-twitter { background: linear-gradient(135deg, #38bdf8, #0f172a); }
        .bg-dc { background: linear-gradient(135deg, #2563eb, #1e3a8a); }
        .bg-guest { background: linear-gradient(135deg, #34d399, #059669); }
        .bg-github { background: linear-gradient(135deg, #334155, #0f172a); }
        .bg-music { background: linear-gradient(135deg, #ec4899, #be185d); }
        .bg-lock { background: linear-gradient(135deg, #64748b, #334155); }

        /* Modal App View */
        .app-modal { position: absolute; inset: 0; background: #121214; color: #f4f4f5; z-index: 80; border-radius: 44px 44px 0 0; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .app-modal.active { transform: translateY(0); }
        .modal-header { padding: 35px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
        .modal-title { font-size: 17px; font-weight: 600; }
        .close-btn { background: #27272a; color: #a1a1aa; border: none; padding: 6px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .close-btn:hover { background: #3f3f46; color: #fff; }
        .modal-body { padding: 24px 20px; overflow-y: auto; flex: 1; font-size: 14px; line-height: 1.6; }

        .profile-card { text-align: center; margin-bottom: 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #3b82f6; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .link-btn { display: block; width: 100%; padding: 14px; background: #27272a; color: #fff; text-align: center; border-radius: 14px; text-decoration: none; font-weight: 600; margin-bottom: 10px; transition: background 0.2s; }
        .link-btn:hover { background: #3f3f46; }

        .gb-input { width: 100%; padding: 12px; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 12px; margin-bottom: 10px; font-size: 14px; outline: none; }
        .gb-input:focus { border-color: #3b82f6; }
        .gb-btn { width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .gb-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .gb-item { background: #18181b; padding: 12px 14px; border-radius: 12px; border: 1px solid #27272a; }
    </style>
</head>
<body>

<div class="iphone">
    <!-- Dynamic Island -->
    <div class="notch"><div class="camera"></div><div style="font-size:10px; opacity:0.8;">9:41</div></div>

    <div class="screen">
        <!-- 잠금 화면 및 암호 패드 -->
        <div class="lock-screen" id="lockScreen">
            <div>
                <div class="clock" id="clock">09:41</div>
                <div class="date" id="date">11월 6일 금요일</div>
            </div>

            <div class="passcode-container">
                <div class="passcode-title" id="passcodeTitle">비밀번호 입력 (0000)</div>
                <div class="passcode-dots">
                    <div class="dot" id="dot0"></div>
                    <div class="dot" id="dot1"></div>
                    <div class="dot" id="dot2"></div>
                    <div class="dot" id="dot3"></div>
                </div>

                <div class="keypad">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="pressKey('3')">3</button>
                    <button class="key-btn" onclick="pressKey('4')">4</button>
                    <button class="key-btn" onclick="pressKey('5')">5</button>
                    <button class="key-btn" onclick="pressKey('6')">6</button>
                    <button class="key-btn" onclick="pressKey('7')">7</button>
                    <button class="key-btn" onclick="pressKey('8')">8</button>
                    <button class="key-btn" onclick="pressKey('9')">9</button>
                    <div></div>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn" style="font-size:14px;" onclick="clearPasscode()">취소</button>
                </div>
            </div>
        </div>

        <!-- 홈 화면 앱 목록 -->
        <div class="app-grid">
            <div class="app-item" onclick="openApp('profile')">
                <div class="app-icon bg-profile">👤</div>
                <div class="app-name">프로필</div>
            </div>
            <div class="app-item" onclick="openApp('instagram')">
                <div class="app-icon bg-insta">📸</div>
                <div class="app-name">Instagram</div>
            </div>
            <div class="app-item" onclick="openApp('twitter')">
                <div class="app-icon bg-twitter">🐦</div>
                <div class="app-name">X (트위터)</div>
            </div>
            <div class="app-item" onclick="openApp('dcinside')">
                <div class="app-icon bg-dc">💬</div>
                <div class="app-name">디시인사이드</div>
            </div>
            <div class="app-item" onclick="openApp('guestbook')">
                <div class="app-icon bg-guest">📝</div>
                <div class="app-name">방명록</div>
            </div>
            <div class="app-item" onclick="openApp('github')">
                <div class="app-icon bg-github">🐙</div>
                <div class="app-name">GitHub</div>
            </div>
            <div class="app-item" onclick="openApp('music')">
                <div class="app-icon bg-music">🎵</div>
                <div class="app-name">플레이리스트</div>
            </div>
            <div class="app-item" onclick="lock()">
                <div class="app-icon bg-lock">🔒</div>
                <div class="app-name">화면 잠금</div>
            </div>
        </div>
    </div>

    <!-- 앱 모달 창 -->
    <div class="app-modal" id="appModal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">앱</span>
            <button class="close-btn" onclick="closeApp()">닫기</button>
        </div>
        <div class="modal-body" id="modalBody">내용</div>
    </div>
</div>

<script>
    // 시계 구현
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').innerText = `${hours}:${minutes}`;
        
        const options = { month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('date').innerText = now.toLocaleDateString('ko-KR', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 비밀번호 로직 (0000)
    let currentPasscode = "";
    const CORRECT_PASSCODE = "0000";

    function pressKey(num) {
        if (currentPasscode.length < 4) {
            currentPasscode += num;
            updateDots();
            
            if (currentPasscode.length === 4) {
                setTimeout(checkPasscode, 150);
            }
        }
    }

    function updateDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot${i}`);
            if (i < currentPasscode.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled', 'error');
            }
        }
    }

    function checkPasscode() {
        if (currentPasscode === CORRECT_PASSCODE) {
            document.getElementById('lockScreen').classList.add('unlocked');
            clearPasscode();
        } else {
            // 암호 틀렸을 때 이펙트
            for (let i = 0; i < 4; i++) {
                document.getElementById(`dot${i}`).classList.add('error');
            }
            document.getElementById('passcodeTitle').innerText = "비밀번호가 올바르지 않습니다";
            setTimeout(() => {
                clearPasscode();
                document.getElementById('passcodeTitle').innerText = "비밀번호 입력 (0000)";
            }, 600);
        }
    }

    function clearPasscode() {
        currentPasscode = "";
        updateDots();
    }

    function lock() {
        clearPasscode();
        document.getElementById('lockScreen').classList.remove('unlocked');
    }

    // 앱 데이터 및 동작
    const appData = {
        profile: {
            title: "👤 프로필",
            content: `
                <div class="profile-card">
                    <div class="profile-avatar">✨</div>
                    <h3 style="font-size:18px; margin-bottom:4px;">나의 포트폴리오</h3>
                    <p style="color:#a1a1aa; font-size:13px;">환영합니다! 소셜 링크와 방명록을 남겨보세요.</p>
                </div>
                <p style="margin-bottom:12px; font-weight:600; color:#d4d4d8;">📌 소개</p>
                <p style="color:#a1a1aa; margin-bottom:20px;">아이폰 UI 감성을 담아 제작한 개인 웹 사이트입니다. 아래 소셜 앱을 통해 저와 소통하실 수 있습니다!</p>
            `
        },
        instagram: {
            title: "📸 Instagram",
            content: `
                <div class="profile-card">
                    <div class="profile-avatar" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);">📷</div>
                    <h3 style="margin-bottom:4px;">@your_instagram</h3>
                    <p style="color:#a1a1aa; font-size:13px;">인스타그램 계정 바로가기</p>
                </div>
                <a href="https://instagram.com" target="_blank" class="link-btn">인스타그램 피드 방문하기</a>
            `
        },
        twitter: {
            title: "🐦 X (Twitter)",
            content: `
                <div class="profile-card">
                    <div class="profile-avatar" style="background:#0f172a;">🐦</div>
                    <h3 style="margin-bottom:4px;">@your_twitter</h3>
                    <p style="color:#a1a1aa; font-size:13px;">X(트위터) 타임라인</p>
                </div>
                <a href="https://twitter.com" target="_blank" class="link-btn">트위터 계정 바로가기</a>
            `
        },
        dcinside: {
            title: "💬 디시인사이드",
            content: `
                <div class="profile-card">
                    <div class="profile-avatar" style="background:#2563eb;">💬</div>
                    <h3 style="margin-bottom:4px;">디시인사이드</h3>
                    <p style="color:#a1a1aa; font-size:13px;">즐겨찾는 커뮤니티 공간</p>
                </div>
                <a href="https://www.dcinside.com" target="_blank" class="link-btn">디시인사이드 가기</a>
            `
        },
        github: {
            title: "🐙 GitHub",
            content: `
                <div class="profile-card">
                    <div class="profile-avatar" style="background:#334155;">🐙</div>
                    <h3 style="margin-bottom:4px;">Meong228</h3>
                    <p style="color:#a1a1aa; font-size:13px;">깃허브 저장소</p>
                </div>
                <a href="https://github.com/Meong228" target="_blank" class="link-btn">GitHub Profile 방문</a>
            `
        },
        music: {
            title: "🎵 플레이리스트",
            content: `
                <h3>🎧 요즘 즐겨듣는 노래</h3><br>
                <div style="background:#18181b; padding:14px; border-radius:12px; border:1px solid #27272a; margin-bottom:8px;">
                    <b>Lofi Chill Beats</b><br><small style="color:#a1a1aa;">Background Music</small>
                </div>
            `
        },
        guestbook: {
            title: "📝 방명록",
            content: `
                <p style="margin-bottom:12px; color:#a1a1aa; font-size:13px;">자유롭게 발자취를 남겨주세요!</p>
                <input type="text" id="gbName" class="gb-input" placeholder="이름 또는 닉네임">
                <textarea id="gbMsg" class="gb-input" placeholder="따뜻한 한마디 남겨주세요 ✨" rows="3"></textarea>
                <button class="gb-btn" onclick="saveGuestbook()">등록하기</button>
                <div class="gb-list" id="gbList"></div>
            `
        }
    };

    function openApp(appName) {
        const modal = document.getElementById('appModal');
        const data = appData[appName];
        document.getElementById('modalTitle').innerText = data.title;
        document.getElementById('modalBody').innerHTML = data.content;
        modal.classList.add('active');
        if(appName === 'guestbook') loadGuestbook();
    }
    function closeApp() { document.getElementById('appModal').classList.remove('active'); }

    function saveGuestbook() {
        const name = document.getElementById('gbName').value.trim();
        const msg = document.getElementById('gbMsg').value.trim();
        if(!name || !msg) return alert('이름과 내용을 모두 입력해주세요!');

        const list = JSON.parse(localStorage.getItem('iphone_gb') || '[]');
        list.unshift({ name, msg, date: new Date().toLocaleDateString() });
        localStorage.setItem('iphone_gb', JSON.stringify(list));

        document.getElementById('gbName').value = '';
        document.getElementById('gbMsg').value = '';
        loadGuestbook();
    }
    function loadGuestbook() {
        const list = JSON.parse(localStorage.getItem('iphone_gb') || '[]');
        const container = document.getElementById('gbList');
        if(!container) return;
        container.innerHTML = list.map(item => `
            <div class="gb-item">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <b style="font-size:13px; color:#38bdf8;">${item.name}</b>
                    <span style="font-size:11px; color:#71717a;">${item.date}</span>
                </div>
                <p style="font-size:13.5px; color:#e4e4e7;">${item.msg}</p>
            </div>
        `).join('');
    }
</script>

</body>
</html>
