<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Home Screen Mockup</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frame {
      width: 430px;
      height: 920px;
      background: #0f0f12;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      position: relative;
    }

    .phone {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0a1b5d 0%, #0b2b75 25%, #102f79 100%);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      color: white;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 0 18px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.4px;
    }

    .status-left { display: flex; align-items: center; gap: 10px; }
    .status-right { display: flex; align-items: center; gap: 12px; }

    .signal {
      display: flex;
      align-items: end;
      gap: 2px;
      height: 14px;
    }
    .signal span {
      width: 4px;
      border-radius: 2px;
      background: white;
      display: block;
    }
    .signal span:nth-child(1) { height: 4px; }
    .signal span:nth-child(2) { height: 6px; }
    .signal span:nth-child(3) { height: 8px; }
    .signal span:nth-child(4) { height: 10px; }

    .battery {
      width: 25px;
      height: 12px;
      border: 2px solid white;
      border-radius: 3px;
      position: relative;
      display: inline-block;
    }
    .battery::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 2px;
      background: white;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 2px;
      width: 3px;
      height: 6px;
      background: white;
      border-radius: 2px;
    }

    .browser-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 18px 10px 18px;
      font-size: 12px;
      color: white;
    }

    .browser-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 700;
      font-size: 15px;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
      font-weight: 300;
    }

    .browser-url {
      margin: 0 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 10px 12px;
      font-size: 13px;
      flex: 1;
      text-align: center;
      color: #dfe7ff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .menu-dots {
      width: 18px;
      height: 18px;
      position: relative;
    }
    .menu-dots::before, .menu-dots::after, .menu-dots span {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      left: 6px;
    }
    .menu-dots::before { top: 0; }
    .menu-dots span { top: 6px; }
    .menu-dots::after { top: 12px; }

    .content {
      padding: 8px 18px 0 18px;
      position: relative;
      height: calc(100% - 100px);
    }

    .notification-bar {
      height: 54px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      margin: 0 auto 18px auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      font-weight: 600;
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .tile {
      height: 180px;
      border-radius: 28px;
      padding: 18px 18px 10px 18px;
      position: relative;
      overflow: hidden;
    }

    .tile.weather {
      background: rgba(255,255,255,0.26);
      backdrop-filter: blur(4px);
    }

    .tile.dark {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(5px);
    }

    .tile-title {
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-bottom: 12px;
    }

    .temp {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
      color: #fff;
    }

    .weather-box {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      height: 100%;
    }

    .weather-small {
      font-size: 18px;
      font-weight: 700;
      margin-top: 10px;
    }

    .moon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      position: relative;
      box-shadow: inset -14px 0 0 rgba(255,255,255,0.2);
    }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
      margin-top: 12px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .icon-box.photo {
      background: linear-gradient(135deg, #ffd3da, #ff9cb6);
    }
    .icon-box.calendar {
      background: linear-gradient(135deg, #d9e4ff, #9cb7ff);
    }
    .icon-box.memo {
      background: linear-gradient(135deg, #e9e7de, #d3d3d1);
    }
    .icon-box.clock {
      background: linear-gradient(135deg, #f0f0f0, #d7d7d7);
    }
    .icon-box.weather-icon {
      background: linear-gradient(135deg, #cfe9ff, #90c6ff);
    }
    .icon-box.settings {
      background: linear-gradient(135deg, #d9d9d9, #a4a4a4);
    }
    .icon-box.phone-app {
      background: linear-gradient(135deg, #6ed4a1, #3bb57a);
    }
    .icon-box.message {
      background: linear-gradient(135deg, #f1f6ff, #d9ebff);
    }

    .camera-icon {
      width: 28px; height: 22px; border-radius: 7px;
      background: white; position: relative;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08);
    }
    .camera-icon::before {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #9dd1ff, #6aa6ff);
      border: 2px solid rgba(255,255,255,0.9);
    }
    .camera-icon::after {
      content: "";
      position: absolute;
      width: 18px; height: 12px;
      top: 3px; left: 5px;
      border-radius: 6px;
      border: 2px solid rgba(0,0,0,0.15);
      opacity: 0.3;
    }

    .calendar-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: white; position: relative;
    }
    .calendar-icon::before {
      content: "";
      position: absolute; inset: 6px;
      border-radius: 5px;
      background: linear-gradient(180deg, #8cb8ff, #5f98ff);
    }
    .calendar-icon::after {
      content: "";
      position: absolute;
      left: 5px; right: 5px; top: 10px; height: 2px; background: rgba(255,255,255,0.8);
      box-shadow: 0 6px 0 rgba(255,255,255,0.8);
    }

    .memo-icon {
      width: 26px; height: 30px; border-radius: 6px; background: white; position: relative;
    }
    .memo-icon::before {
      content: "";
      position: absolute; left: 6px; right: 6px; top: 9px; height: 2px; background: #d0d0d0;
      box-shadow: 0 6px 0 #d0d0d0, 0 12px 0 #d0d0d0;
    }

    .clock-icon {
      width: 28px; height: 28px; border-radius: 50%; background: white; position: relative;
    }
    .clock-icon::before {
      content: "";
      position: absolute; left: 13px; top: 13px; width: 2px; height: 8px; background: #888;
      transform-origin: bottom center;
      transform: rotate(40deg);
      border-radius: 2px;
    }
    .clock-icon::after {
      content: "";
      position: absolute; left: 13px; top: 13px; width: 2px; height: 10px; background: #888;
      transform-origin: bottom center;
      transform: rotate(150deg);
      border-radius: 2px;
    }

    .cloud-icon {
      width: 32px; height: 18px; background: white; border-radius: 16px; position: relative;
      box-shadow: 10px -6px 0 2px rgba(255,255,255,0.7);
    }
    .cloud-icon::before {
      content: "";
      position: absolute; width: 14px; height: 14px; background: white;
      border-radius: 50%; left: 6px; top: -6px;
    }

    .settings-icon {
      width: 30px; height: 30px; border-radius: 50%; background: #f3f3f3; position: relative;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
    }
    .settings-icon::before {
      content: "";
      position: absolute; inset: 8px; border-radius: 50%;
      background: linear-gradient(180deg, #888, #555);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.6);
    }

    .phone-icon {
      width: 24px; height: 24px; border: 3px solid white; border-radius: 50%;
      position: relative;
    }
    .phone-icon::before {
      content: "";
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: white;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }

    .message-icon {
      width: 30px; height: 24px; border-radius: 8px; background: white; position: relative;
    }
    .message-icon::before {
      content: "";
      position: absolute; left: 6px; right: 6px; top: 7px; height: 2px; background: #9eaec7;
      box-shadow: 0 6px 0 #9eaec7;
    }
    .message-icon::after {
      content: "";
      position: absolute; left: 8px; bottom: -4px; width: 12px; height: 12px; background: white; transform: rotate(45deg);
      border-radius: 2px;
    }

    .social-icon {
      width: 32px; height: 32px; border-radius: 9px; position: relative;
      background: linear-gradient(135deg, #ffdc62, #d96bff);
    }
    .social-icon::before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      left: 7px; top: 7px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.32);
    }
    .social-icon::after {
      content: "";
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
      right: 7px; top: 7px;
    }

    .instagram-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f7d154, #d64fb8, #5057d1);
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
    }
    .instagram-icon::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 5px;
      border: 2px solid white;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
    .instagram-icon::after {
      content: "";
      position: absolute;
      width: 6px; height: 6px; border-radius: 50%; background: white;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      box-shadow: 12px -11px 0 -2px white;
    }

    .safari-icon {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #56d0ff, #3c7bff);
      position: relative;
    }
    .safari-icon::before {
      content: "";
      position: absolute; inset: 6px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.85);
    }
    .safari-icon::after {
      content: "";
      position: absolute;
      width: 12px; height: 12px;
      background: linear-gradient(135deg, #ffffff, #e4f4ff);
      border-radius: 50%;
      right: 4px; top: 4px;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
    }

    .label {
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      font-weight: 500;
      white-space: nowrap;
    }

    .dock {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      height: 86px;
      background: rgba(255,255,255,0.1);
      border-radius: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      backdrop-filter: blur(10px);
    }

    .dock .app {
      width: 52px; height: 52px;
      border-radius: 16px;
      position: relative;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.13);
    }

    .dock .app.red { background: linear-gradient(135deg, #ffb4b4, #ff7f7f); }
    .dock .app.green { background: linear-gradient(135deg, #a5f0b0, #5ccf7d); }
    .dock .app.blue { background: linear-gradient(135deg, #b9ddff, #6ca6ff); }
    .dock .app.orange { background: linear-gradient(135deg, #ffd3a6, #f09152); }

    .badge {
      position: absolute;
      top: -4px;
      right: -6px;
      width: 20px;
      height: 20px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 50%;
      background: red;
      color: white;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,255,255,0.8);
    }

    .searchbar {
      margin: 14px auto 20px auto;
      width: 100%;
      height: 50px;
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.75);
      font-size: 20px;
      letter-spacing: 0.4px;
    }
    .searchbar .lens {
      width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.8); border-radius: 50%; position: relative; margin-right: 10px;
    }
    .searchbar .lens::after {
      content: "";
      position: absolute;
      width: 8px; height: 3px; background: rgba(255,255,255,0.8);
      right: -7px; bottom: -4px; transform: rotate(45deg);
      border-radius: 2px;
    }

    @media (max-width: 480px) {
      .frame {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
